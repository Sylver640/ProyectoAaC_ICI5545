<ion-header>
  <div class="custom-header">
    <div class="custom-container"></div>
    <h1>Editar actividad</h1>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-content>
      <!-- Fecha -->
      <ion-item>
         <ion-label class="fecha-label" position="stacked">Fecha de la actividad</ion-label>
        <ion-datetime
          presentation="date"
          [(ngModel)]="form.fecha"
          locale="es-ES"
          placeholder="Seleccione una fecha">
        </ion-datetime>
      </ion-item>
      <div class="custom-container"></div>
      <!-- Titulo -->
      <div class="form-item">
        <label for="titulo" class="stacked-label">Título</label>
        <input 
          id="titulo" 
          [(ngModel)]="form.titulo" 
          type="text" 
          class="custom-input-stacked"
        >
      </div>
      
      <!-- Ubicación -->
      <div class="form-item">
        <label for="ubicacion" class="stacked-label">Ubicación</label>
        <select id="ubicacion" [(ngModel)]="form.ubicacion" class="custom-select">
          <option value="" disabled selected>Seleccione</option>
          <option *ngFor="let lugar of ubicaciones" [value]="lugar">{{ lugar }}</option>
        </select>
      </div>

      <!-- Mensaje -->
      <div class="form-item">
        <label for="mensaje" class="stacked-label">Mensaje</label>
        <input 
          id="mensaje" 
          [(ngModel)]="form.mensaje" 
          type="text" 
          class="custom-input-stacked"
        >
      </div>

      <!-- Habilitar recordatorio -->
      <div class="form-item checkbox-item">
        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="form.recordatorio" class="custom-checkbox">
          <span class="checkmark"></span>
          <span class="checkbox-label">Habilitar recordatorio</span>
        </label>
      </div>

      <!-- Días antes de la notificación -->
      <div class="form-item" *ngIf="form.recordatorio">
        <label for="diasAntes" class="stacked-label">¿Cuántos días antes desea recibir las notificaciones?</label>
        <input 
          id="diasAntes" 
          type="number" 
          [(ngModel)]="form.diasAntes" 
          class="custom-input-stacked"
        >
      </div>

      <!-- Botones Guardar y Cancelar -->
      <div class="ion-padding-top ion-text-center">
        <ion-grid>
          <ion-row class="ion-justify-content-center">
            <ion-col size="6">
              <ion-button expand="block" color="danger" (click)="cancelar()">Cancelar</ion-button>
            </ion-col>
            <ion-col size="6">
              <ion-button expand="block" color="success" (click)="guardar()">Actualizar</ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>

      <div class="perfil-container" (click)="mensajeGuardado()"></div>

      <ion-text class="danger-text" *ngIf="errorFormulario">
        <p>{{ errorFormulario }}</p>
      </ion-text>

      <div class="popup-overlay" *ngIf="mostrarPopupExito">
        <div class="popup-content">
          <h2>¡Actividad Actualizada!</h2>
          <p>La actividad se ha guardado exitosamente.</p>
          <div class="popup-buttons">
            <ion-button expand="block" color="primary" (click)="cerrarPopup()">Aceptar</ion-button>
          </div>
        </div>
      </div>

    </ion-card-content>
  </ion-card>
</ion-content>
